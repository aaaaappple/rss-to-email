name: 自动抓取资讯推邮箱
on:
  # 定时运行：每分钟检查一次数据源（最快频率，免费资源够用）
  schedule:
    - cron: '* * * * *'
  # 手动触发（测试用，不用改）
  workflow_dispatch:

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
      
      - name: 安装Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 安装必要工具
        run: pip install feedparser
      
      - name: 运行脚本，推送邮件
        run: python rss_fetch.py
      
      - name: 保存已推送记录（防重复）
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "action@github.com"
          git add pushed_ids.txt
          git commit -m "更新已推送资讯ID"
          git push
        continue-on-error: true  # 避免小问题中断运行
